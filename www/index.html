<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thermal">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Thermal — workout tracker</title>
<style>
:root{
  --ink:#07090d; --surface:#0f141d; --raised:#1b2231; --line:#1a2230;
  --line-solid:#263041; --text:#e9eef7; --muted:#8796ae; --dim:#7d8aa0;
  --hud:#0b0f16;
  --amber:#ffb02e; --amber-dim:#7a5416; --cyan:#3fb6d8; --red:#e8425f;
  --ok:#49d69d;
  --pad:16px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.4; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input{-webkit-appearance:none;appearance:none}

/* ---------- shell ---------- */
#app{min-height:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;
  background:linear-gradient(180deg,var(--ink) 72%,#07090d00);
  display:flex;align-items:baseline;gap:10px;
}
.eyebrow{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  font-weight:600;
}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.screen{padding:0 var(--pad) 24px;animation:fade .22s ease}
.screen.still{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
  background:#0b0f16f2;backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;
  color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
}
.tabbar button.on{color:var(--amber)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px;
}
.card.tap:active{background:var(--raised)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.title{font-weight:700;font-size:16px;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--dim);flex:none}

.daycard{position:relative;overflow:hidden}
.daycard .bars{display:flex;gap:3px;margin-top:12px}
.daycard .bars i{height:4px;border-radius:2px;flex:1;display:block}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;
  background:var(--amber);color:#20160a;letter-spacing:-.01em;
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--line-solid)}
.btn.quiet{background:none;color:var(--muted);font-weight:600;font-size:14px;padding:12px}
.btn.danger{background:none;color:var(--red);font-weight:600}

/* ---------- body map ---------- */
.bodywrap{display:flex;gap:0;justify-content:center;padding:4px 0 0}
.bodywrap svg{width:50%;max-width:190px;height:auto;display:block}
.skin{fill:#131923}
.muscle{fill:#1d2534;stroke:#07090d;stroke-width:2.5;stroke-linejoin:round;transition:fill .45s cubic-bezier(.4,0,.2,1)}
.tappable .muscle{cursor:pointer}
.tappable .muscle:active{opacity:.75}
.viewlabels{display:flex;justify-content:center;gap:0;margin-top:2px}
.viewlabels span{flex:1;text-align:center;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);font-weight:600;max-width:190px}
.legend{display:flex;align-items:center;gap:8px;margin-top:14px}
.legend .ramp{height:6px;border-radius:3px;flex:1;
  background:linear-gradient(90deg,#232b3a,#2f6f8c,#e0b240,#e8683a,#e8425f)}
.legend span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}

.rank{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.rank .r{display:flex;align-items:center;gap:10px}
.rank .r .nm{width:88px;font-size:12px;color:var(--muted);flex:none}
.rank .r .tr{flex:1;height:8px;border-radius:4px;background:#191f2c;overflow:hidden}
.rank .r .tr i{display:block;height:100%;border-radius:4px;transition:width .5s}
.rank .r .vl{width:34px;text-align:right;font-size:11px;color:var(--dim)}

/* ---------- session ---------- */
.exhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.exdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.setrow{
  display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;
  padding:6px 0;border-top:1px solid var(--line);
}
.setrow.head{border-top:0;padding-bottom:2px}
.setrow.head div{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.setno{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center}
.stepper{display:flex;align-items:center;background:#10151f;border:1px solid var(--line);border-radius:11px;height:44px}
.stepper button{width:34px;height:100%;color:var(--muted);font-size:19px;font-weight:500;flex:none}
.stepper button:active{color:var(--amber)}
.stepper input{
  width:100%;min-width:0;background:none;border:0;text-align:center;
  font-family:var(--mono);font-size:16px;font-weight:600;padding:0;
  font-variant-numeric:tabular-nums;
}
.stepper input:focus{outline:none;color:var(--amber)}
.tick{
  height:44px;border-radius:11px;border:1px solid var(--line-solid);
  display:flex;align-items:center;justify-content:center;color:var(--dim);
}
.tick svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .tick{background:var(--ok);border-color:var(--ok);color:#08150f}
.setrow.done .stepper{border-color:#1f2b3a;background:#0d121b}
.setrow.done .stepper input{color:var(--muted)}

.resting{
  position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom) + 8px);
  z-index:45;background:#101722;border:1px solid #2c3a4e;border-radius:16px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:0 12px 34px #00000073;animation:rise .25s ease;
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.resting .t{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em}
.resting .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);
  border-radius:0 0 16px 16px;transition:width 1s linear}

/* ---------- misc ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);
}
.chip.on{background:var(--amber);border-color:var(--amber);color:#20160a}
.empty{text-align:center;padding:48px 20px;color:var(--dim)}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}
.stat{display:flex;gap:0}
.stat div{flex:1}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:3px}
.sheet-bg{position:fixed;inset:0;background:#000000a6;z-index:60;animation:fade .2s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line-solid);
  padding:18px var(--pad) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .26s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;
}
.grab{width:38px;height:4px;border-radius:2px;background:#2c3648;margin:0 auto 16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600;margin-bottom:6px}
.field input,.field select{
  width:100%;background:#10151f;border:1px solid var(--line-solid);border-radius:12px;
  padding:13px;font-size:16px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--amber)}
.hr{height:1px;background:var(--line);margin:16px 0}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:4px 8px;border-radius:6px;background:var(--raised);color:var(--muted)}
.swipe{display:flex;align-items:center;justify-content:space-between}
.live{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- v2: set types, supersets, menus ---------- */
.setrow{grid-template-columns:32px 1fr 1fr 46px}
button.setno{height:44px;border-radius:10px;font-weight:700}
button.setno:active{background:var(--raised)}
.setrow.t-w .setno,.st.t-w{color:#c99a45}
.setrow.t-d .setno,.st.t-d{color:var(--cyan)}
.setrow.t-f .setno,.st.t-f{color:var(--red)}
.setrow.t-w:not(.done) .stepper input{color:var(--muted)}
.st{font-style:normal;font-weight:700;font-size:10px;margin-right:2px}
.hint{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.exname{text-align:left;min-width:0}
.exname .title{overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;margin:-10px -10px -10px 0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:12px;flex:none}
.iconbtn:active{background:var(--raised)}
.superset{position:relative;margin-bottom:12px;padding-left:12px}
.superset::before{content:"";position:absolute;left:0;top:24px;bottom:6px;width:3px;border-radius:2px;background:var(--amber-dim)}
.superset .card{margin-bottom:8px}
.ss-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c99a45;font-weight:700;margin:2px 0 8px}
.superset.plan{padding-left:10px;margin:6px 0}
.superset.plan::before{top:20px;bottom:4px}
.superset.plan .ss-label{margin:8px 0 2px}
.menu{display:flex;flex-direction:column;border:1px solid var(--line-solid);border-radius:14px;overflow:hidden}
.menu button{text-align:left;padding:14px;font-weight:600;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu button:active{background:var(--raised)}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chips.sm .chip{padding:6px 11px;font-size:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text)}
.rank.wide .r .vl{width:74px}
.prtxt{color:var(--amber);font-weight:600}
.pr{font-size:9px;font-weight:800;letter-spacing:.08em;color:#20160a;background:var(--amber);border-radius:5px;padding:2px 5px;vertical-align:1px}
.logex,.dayrow{width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line);align-items:flex-start}
.dayrow{padding:9px 0}
.logex .sets,.hist .sets{text-align:right;white-space:normal;word-spacing:2px}
.hist{padding:7px 0;border-top:1px solid var(--line);align-items:flex-start}
.planrow{grid-template-columns:1fr auto auto;gap:10px;cursor:pointer}
.nm1{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.note{border-color:#5a3d1a;background:#1d1912;font-size:13px}
.card.note .sub{margin-top:4px}
.card.flat{background:var(--raised);margin-bottom:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:80;
  background:#1f2838;border:1px solid #33425a;color:var(--text);padding:10px 16px;border-radius:999px;
  font-weight:600;font-size:14px;box-shadow:0 10px 30px #0008;animation:drop .25s ease;max-width:calc(100% - 32px);text-align:center}
.toast.pr{background:var(--amber);border-color:var(--amber);color:#20160a}
.toast.out{opacity:0;transition:opacity .35s}
@keyframes drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- v2: picker, info sheet, calculators ---------- */
.sheet.tall{height:88vh}
.search{display:flex;align-items:center;gap:8px;background:#10151f;border:1px solid var(--line-solid);border-radius:12px;padding:0 12px;margin:14px 0 10px;color:var(--dim)}
.search:focus-within{border-color:var(--amber)}
.search input{flex:1;min-width:0;background:none;border:0;padding:12px 0;font-size:16px}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
#pk-g{padding-bottom:6px}
.keep{gap:10px;margin:2px 0 8px;cursor:pointer}
.keep input{width:20px;height:20px;accent-color:var(--amber);-webkit-appearance:checkbox;appearance:auto}
.pick{display:flex;align-items:center;border-top:1px solid var(--line)}
.pk-main{flex:1;min-width:0;text-align:left;padding:11px 0}
.pk-main:active{opacity:.6}
.pk-n{font-weight:600}
.pick.custom{width:100%;text-align:left;padding:12px 0;gap:10px;border-top:0}
.pick.custom .pk-n{color:var(--amber)}
.pickfield{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#10151f;border:1px solid var(--line-solid);border-radius:12px;padding:13px;font-size:16px;font-weight:600}
.bodywrap.mini svg{max-width:96px}
.viewlabels.mini span{max-width:96px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:#222a38;stroke-width:1}
.chart .axis{fill:var(--dim);font-size:9px;font-family:var(--mono)}
.chart .line{fill:none;stroke:var(--amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--amber)}
.chart .dot.last{fill:var(--surface);stroke:var(--amber);stroke-width:2}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos img{width:100%;border-radius:10px;display:block;background:#fff;aspect-ratio:3/2;object-fit:cover}
.steps{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.5}
.steps li{margin-bottom:6px}
.wu{gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.wu .st{width:22px;font-size:12px}
.plates-out{padding:14px;background:var(--raised);border-radius:14px;margin-bottom:8px}
.platevis{display:flex;align-items:center;gap:3px;min-height:100px}
.sleeve{display:block;width:30px;height:10px;background:#3a4558;border-radius:2px}
.plate{display:flex;align-items:flex-end;justify-content:center;width:22px;border-radius:4px;font-style:normal}
.plate b{font-size:9px;color:#0c0f16;font-family:var(--mono);margin-bottom:4px;writing-mode:vertical-rl;transform:rotate(180deg)}
/* ---------- v3: swipe to delete, floating-bar spacing ---------- */
.setwrap{position:relative;overflow:hidden;border-radius:11px}
.setdel{position:absolute;right:0;top:5px;bottom:5px;width:84px;border-radius:11px;background:var(--red);color:#fff;font-weight:700;font-size:14px}
.setwrap .setrow{position:relative;background:var(--surface);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.setwrap.swiped .setrow{transform:translateX(-92px)}
body.floating-bar #app{padding-bottom:calc(168px + env(safe-area-inset-bottom))}
.logtitle{text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- v3: weekly targets, muscle sheet, nudges, summary ---------- */
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.wk{display:grid;grid-template-columns:92px 1fr 88px;align-items:center;gap:10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.wk:first-of-type{border-top:0}
.wk-n{font-size:13px;color:var(--text)}
.wk-t{position:relative;height:10px;border-radius:5px;background:#171d29;overflow:hidden}
.wk-t .band{position:absolute;top:0;bottom:0;background:#2a3446}
.wk-t .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:4px}
.fill.under{background:var(--cyan)} .fill.on{background:var(--ok)} .fill.over{background:var(--amber)}
.wk-v{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.wk-v b{font-size:13px;font-weight:700}
b.under{color:var(--cyan)} b.on{color:var(--ok)} b.over{color:var(--amber)}
.nudge{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 12px;border-radius:12px;background:#2a1d0b;border:1px solid #5a3d1a;font-size:13px;color:#f5d9a8;line-height:1.35}
.nudge b{color:var(--amber)}
.nudge .go{font-size:12px;font-weight:800;color:#20160a;background:var(--amber);border-radius:8px;padding:8px 11px;flex:none}
.nudge .x{width:32px;height:32px;color:#c99a45;font-size:18px;flex:none}
.tgt{display:flex;align-items:center;gap:8px}
.tgt .num{min-width:28px;text-align:center;font-size:17px;font-weight:700}
.tgt button{width:40px;height:40px;border-radius:10px;background:var(--raised);font-size:18px;color:var(--muted)}
.mlist .row{padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.sumgrid .card{margin:0}
.sumgrid .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sumgrid .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:4px}
.sumgrid .card.rec{border-color:#5a3d1a;background:#1d1912}
.recrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.up{color:var(--ok)}
/* ---------- Infrared look ---------- */
.eyebrow{font-family:var(--mono);letter-spacing:.18em;color:var(--muted);font-weight:500}
h1{font-size:30px}
.card{border-radius:18px}
.hud{position:relative;border-radius:20px;background-color:var(--hud);
  background-image:
    linear-gradient(var(--amber),var(--amber)),linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)),linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)),linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)),linear-gradient(var(--amber),var(--amber)),
    linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  background-size:14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,14px 2px,2px 14px,22px 22px,22px 22px;
  background-position:left 10px top 10px,left 10px top 10px,right 10px top 10px,right 10px top 10px,
    left 10px bottom 10px,left 10px bottom 10px,right 10px bottom 10px,right 10px bottom 10px,0 0,0 0;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  padding:20px 16px 30px}
.legend span{font-family:var(--mono)}
.legend .ramp{background:linear-gradient(90deg,#24304a,#2f6f8c,#e0b240,#e8683a,#e8425f)}
.rank .r .nm{color:var(--text);font-weight:600;font-size:13px}
.rank .r .vl{font-family:var(--mono);color:#c4cede}
.exdot.lit{box-shadow:0 0 10px currentColor}
.tag.finish{background:var(--amber);color:#20160a;font-size:12px;font-weight:800;padding:9px 13px;border-radius:10px;letter-spacing:.1em}
.setrow.current .stepper:first-of-type{border-color:var(--amber)}
.setrow.current .stepper:first-of-type input{color:var(--amber)}
.setrow.done.t-w .tick{background:#1d4d3b;border-color:#1d4d3b;color:var(--ok)}
.resting{border-color:#ffb02e66;box-shadow:0 12px 34px #000000a0,0 0 30px #ffb02e22;overflow:hidden;border-radius:18px}
.resting .t{font-size:30px;color:var(--amber)}
.resting #rest-label{font-family:var(--sans);letter-spacing:.16em;font-weight:600}
.resting .bar{height:3px;background:linear-gradient(90deg,#e8683a,var(--amber));border-radius:0}
.resting .tag{font-size:12px;padding:9px 11px;border-radius:9px;letter-spacing:0;text-transform:none;color:#c4cede}
.toast{border-radius:14px}
</style>

/* The library: curated rows above, plus ~480 more from library.json once it
   loads. Every name and alias is indexed by key(). */
const LIB = { byKey:new Map(), list:[], info:null, loaded:false };
function indexEntry(e){
  LIB.list.push(e);
  [e.n, ...(e.a||[])].forEach(x=>{ const k = key(x); if(k && !LIB.byKey.has(k)) LIB.byKey.set(k, e); });
}
LIB_CORE.forEach(([n,m,eq,id,a])=> indexEntry({n, m, eq, id, a, core:true}));

let libLoading = null;
function loadLibrary(){
  if(libLoading) return libLoading;
  libLoading = fetch('library.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
    d.auto.forEach(([n,m,eq,id])=> indexEntry({n, m, eq, id, a:[], core:false}));
    LIB.info = d.info; LIB.loaded = true; muscleCache.clear();
  }).catch(err=>{ console.warn('Library not loaded', err); libLoading = null; });
  return libLoading;
}
const libEntry = name => LIB.byKey.get(key(name)) || null;
// History is grouped by library exercise, so "Shrugs" and "Barbell Shrug" share PRs.
const canon = name => { const e = libEntry(name); return e ? key(e.n) : key(name); };

const muscleCache = new Map();
function musclesFor(name){
  const k = key(name); if(!k) return {};
  if(muscleCache.has(k)) return muscleCache.get(k);
  const e = LIB.byKey.get(k);
  let m = e ? e.m : null;
  if(!m){
    const n = (name||'').toLowerCase();
    for(const [re,mm] of KEYS) if(re.test(n)){ m = mm; break; }
  }
  m = m || {};
  muscleCache.set(k, m);
  return m;
}
const topMuscles = (name, n=3) => Object.entries(musclesFor(name)).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>MUSCLES[k]);
// Plate maths only makes sense for things you load with plates.
const isPlateLoaded = name => { const e = libEntry(name); return !e || ['barbell','smith','ezbar','machine','other'].includes(e.eq); };

/* ---------------- heat ramp ---------------- */
const RAMP = [
  [0.00,[26,32,44]], [0.02,[36,58,84]], [0.28,[47,111,140]],
  [0.52,[224,178,64]], [0.76,[232,104,58]], [1.00,[232,66,95]]
];
function heat(t){
  t = Math.max(0, Math.min(1, t));
  for (let i=0;i<RAMP.length-1;i++){
    const [a,ca]=RAMP[i], [b,cb]=RAMP[i+1];
    if (t<=b){
      const k=(t-a)/(b-a||1);
      const c=ca.map((v,j)=>Math.round(v+(cb[j]-v)*k));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(232,66,95)';
}

/* Paint muscles from levels in 0..1 (absent or 0 = untouched, drawn in the base tone).
   Hot muscles (≥ .5) also get a blurred copy in the glow layer behind the figure. */
function paintLevels(root, level){
  if(!root) return;
  root.querySelectorAll('svg').forEach(svg=>{
    const glow = svg.querySelector('.glow'); if(glow) glow.textContent = '';
    svg.querySelectorAll('.muscle').forEach(el=>{
      const t = level[el.dataset.m] || 0;
      el.style.fill = t > 0 ? heat(t) : '';
      el.classList.toggle('lit', t > 0);
      if(glow && t >= .5){
        const g = el.cloneNode(); g.removeAttribute('class'); g.removeAttribute('data-m');
        g.style.fill = heat(t); g.setAttribute('opacity', Math.min(.8, (t - .35)).toFixed(2));
        glow.appendChild(g);
      }
    });
  });
}
// Heat: relative to the busiest muscle in view, with a floor so any work shows.
function paintBody(root, load){
  const max = Math.max(0.0001, ...Object.values(load)), lv = {};
  for(const k in load) if(load[k] > 0) lv[k] = 0.14 + 0.86*load[k]/max;
  paintLevels(root, lv);
}
// Tap a muscle anywhere a body map is shown to see its week.
function wireBodyTaps(root){
  if(!root) return;
  root.classList.add('tappable');
  root.onclick = e => { const m = e.target.closest && e.target.closest('.muscle'); if(m) muscleSheet(m.dataset.m); };
}

/* ---------------- state ---------------- */
const uid = () => Math.random().toString(36).slice(2,9);

/* Ships empty. Everyone builds their own plan, or imports one.
   v2 adds, all optional so v1 data and backups load unchanged:
     set.t        'w' warm-up · 'd' drop · 'f' failure (absent = normal working set)
     exercise.rest  seconds; absent = S.restDefault
     exercise.group superset id shared by neighbouring exercises
     session exercise.pid  the plan exercise it came from
     S.barKg / S.barLb    bar weight for the plate calculator */
const SEED = {
  version:2, unit:'kg', restDefault:90, barKg:20, barLb:45,
  plans:[{ id:'w1', name:'My Plan', days:[] }],
  sessions:[], active:null
};

let S = null;                       // app state
let route = {tab:'train', dayId:null, planId:null};
let saveTimer = null;

/* ---------------- native bridge ----------------
   Inside the iPhone app, Capacitor's bridge is injected as window.Capacitor.
   We call plugins directly with nativePromise, so there's no bundler and the
   same file still runs as the web app. Everything below no-ops on the web. */
const NATIVE = !!(window.Capacitor && typeof Capacitor.isNativePlatform === 'function' && Capacitor.isNativePlatform());
const nat = (plugin, method, opts={}) =>
  NATIVE ? Capacitor.nativePromise(plugin, method, opts) : Promise.reject(new Error('not native'));
const DATA_FILE = {path:'thermal-data.json', directory:'LIBRARY', encoding:'utf8'};

function buzz(kind='light'){
  if(NATIVE){
    if(kind==='done') nat('Haptics','notification',{type:'SUCCESS'}).catch(()=>{});
    else nat('Haptics','impact',{style: kind==='medium' ? 'MEDIUM' : 'LIGHT'}).catch(()=>{});
  } else if(navigator.vibrate){
    navigator.vibrate(kind==='done' ? [90,60,90] : kind==='medium' ? 14 : 6);
  }
}

function migrate(s){
  if(!s || !Array.isArray(s.plans) || !s.plans.length) return structuredClone(SEED);
  s.version = 2;
  s.unit = s.unit || 'kg';
  s.restDefault = s.restDefault || 90;
  s.barKg = s.barKg ?? 20; s.barLb = s.barLb ?? 45;
  s.sessions = s.sessions || [];
  s.active = s.active || null;
  return s;
}

/* Storage. On the web: localStorage. In the app: a file in the app's Library
   folder, because iOS can clear a web view's localStorage when space runs low.
   localStorage is still written as a mirror, and is the fallback on first run. */
async function load(){
  let raw = null;
  if(NATIVE){
    try{ raw = (await nat('Filesystem','readFile', DATA_FILE)).data; }catch(e){ raw = null; }
  }
  if(!raw){ try{ raw = localStorage.getItem('thermal:v1'); }catch(e){} }
  try{ S = migrate(raw ? JSON.parse(raw) : null); }
  catch(e){ S = structuredClone(SEED); }
}
let saving = Promise.resolve();
function writeNow(){
  clearTimeout(saveTimer); saveTimer = null;
  const text = JSON.stringify(S);
  try{ localStorage.setItem('thermal:v1', text); }catch(e){ console.warn('Save failed', e); }
  if(NATIVE){
    saving = saving.then(()=> nat('Filesystem','writeFile', {...DATA_FILE, data:text, recursive:true}))
                   .catch(e=> console.warn('File save failed', e));
  }
  return saving;
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 300);
}
// Leaving the app (or locking the phone) flushes any pending save immediately.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && saveTimer) writeNow();
});

/* ---------------- volume math ---------------- */
// planned load: sets are the unit of stimulus, scaled by muscle contribution
function plannedLoad(day){
  const out = {};
  (day.exercises||[]).forEach(e=>{
    const m = musclesFor(e.name);
    for(const k in m) out[k] = (out[k]||0) + (e.sets||3)*m[k];
  });
  return out;
}
// Warm-ups are logged but never count: not on the heat map, not in volume, not for PRs.
const working = s => s.done && s.t !== 'w';
function sessionLoad(sess){
  const out = {};
  (sess.exercises||[]).forEach(e=>{
    const n = (e.sets||[]).filter(working).length;
    const m = musclesFor(e.name);
    for(const k in m) out[k] = (out[k]||0) + n*m[k];
  });
  return out;
}
function mergeLoads(list){
  const out={}; list.forEach(l=>{for(const k in l) out[k]=(out[k]||0)+l[k];}); return out;
}
function tonnage(sess){
  let t=0; (sess.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{ if(working(s)) t+= (+s.weight||0)*(+s.reps||0); }));
  return t;
}
function doneSets(sess){
  let n=0; (sess.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{ if(working(s)) n++; })); return n;
}
function anyDone(sess){
  return (sess.exercises||[]).some(e=>(e.sets||[]).some(s=>s.done));
}

/* ---------------- strength history ----------------
   Estimated 1-rep max (Epley): weight × (1 + reps/30). Rough above ~12 reps,
   but it's the standard way to compare 100×5 against 90×8. */
const e1rm = (w,r) => (+r>0 && +w>0) ? (+r===1 ? +w : +w*(1 + +r/30)) : 0;
const round1 = n => Math.round(n*10)/10;

// Every logged appearance of an exercise, oldest first.
function historyOf(name){
  const c = canon(name), out = [];
  for(let i=S.sessions.length-1; i>=0; i--){
    const s = S.sessions[i];
    (s.exercises||[]).forEach(e=>{
      if(canon(e.name) !== c) return;
      const sets = (e.sets||[]).filter(working);
      if(!sets.length) return;
      const bw = sets.filter(x=>!(+x.weight > 0));
      out.push({at:s.ended||s.started, session:s, ex:e, sets,
        best: Math.max(...sets.map(x=>e1rm(x.weight,x.reps))),
        top: Math.max(...sets.map(x=>+x.weight||0)),
        reps: Math.max(0, ...bw.map(x=>+x.reps||0)),          // best bodyweight set
        totalReps: sets.reduce((n,x)=>n+(+x.reps||0),0),
        vol: sets.reduce((n,x)=>n+(+x.weight||0)*(+x.reps||0),0)});
    });
  }
  return out;
}
function bestE1rm(name, excludeId){
  let b = 0;
  historyOf(name).forEach(h=>{ if(h.session.id !== excludeId) b = Math.max(b, h.best); });
  return b;
}
// Bodyweight sets (no added weight) are judged on reps instead of estimated 1RM.
function bestReps(name, excludeId){
  let b = 0;
  historyOf(name).forEach(h=>{ if(h.session.id !== excludeId) b = Math.max(b, h.reps); });
  return b;
}
// Every record, per session: walks oldest to newest so each session is judged
// only against what came before. First appearances aren't records.
function recordsBySession(){
  const bestW = new Map(), bestR = new Map(), out = new Map();
  for(let i=S.sessions.length-1; i>=0; i--){
    const s = S.sessions[i];
    (s.exercises||[]).forEach((e,ei)=>{
      const c = canon(e.name), sets = (e.sets||[]).filter(working);
      const w = Math.max(0, ...sets.filter(x=>+x.weight>0).map(x=>e1rm(x.weight,x.reps)));
      const r = Math.max(0, ...sets.filter(x=>!(+x.weight>0)).map(x=>+x.reps||0));
      const add = rec => { if(!out.has(s.id)) out.set(s.id, []); out.get(s.id).push({ei, name:e.name, ...rec}); };
      if(w > 0){
        if(bestW.has(c) && w > bestW.get(c) + 1e-9) add({kind:'e1rm', value:w, prev:bestW.get(c)});
        bestW.set(c, Math.max(bestW.get(c)||0, w));
      } else if(r > 0){
        if(bestR.has(c) && r > bestR.get(c)) add({kind:'reps', value:r, prev:bestR.get(c)});
        bestR.set(c, Math.max(bestR.get(c)||0, r));
      }
    });
  }
  return out;
}
function prMap(){
  const prs = new Set();
  recordsBySession().forEach((list, sid)=> list.forEach(r=> prs.add(sid+'|'+r.ei)));
  return prs;
}
const findDay = id => { for(const p of S.plans){ const d=p.days.find(d=>d.id===id); if(d) return {plan:p,day:d}; } return null; };

  renderTabs();
  setTimeout(paintBanner, 0);
  if (S.active && route.tab==='train') return renderSession();
  if (route.tab==='train' && route.view && findDay(route.view)) return openDay(route.view);
  if (route.tab!=='log' && route.view && String(route.view).startsWith('sum:')) route.view = null;
  ({train:renderTrain, body:renderBody, log:renderLog, plan:renderPlan}[route.tab]||renderTrain)();
}

/* ---------- TRAIN ---------- */

        The body map fills in as you go, so you can see what a session actually hits
        before you do it. If someone sent you a routine file, import it instead.

  html += `<button class="btn ghost" data-new-day style="margin-top:4px">+ New workout day</button>`;
  html += '</div>';

function openDay(dayId){
  const {plan,day} = findDay(dayId);
  route.view = dayId;
  const load = plannedLoad(day);
  const max = Math.max(0.0001,...Object.values(load));
  const ranked = Object.entries(load).sort((a,b)=>b[1]-a[1]);

  let html = `<div class="topbar">
    <button data-back style="color:var(--muted);margin-right:2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>

  </div><div class="screen">`;

  html += `<div class="card hud">${bodyMap(load,{id:'preview'})}
    <div class="legend"><span>Light</span><div class="ramp"></div><span>Heavy</span></div>
    <div class="rank">${ranked.slice(0,6).map(([k,v])=>`
      <div class="r"><div class="nm">${MUSCLES[k]}</div>
      <div class="tr"><i style="width:${Math.round(100*v/max)}%;background:${heat(0.14+0.86*v/max)}"></i></div>
      <div class="vl">${fmt(round1(v))}</div></div>`).join('')}</div>
  </div>`;

  // Heads-up if this day leans on muscles that haven't recovered yet.
  const fat = fatigueAt(Date.now());
  const sore = ranked.slice(0,6).filter(([k])=>(fat[k]||0) >= .4).map(([k])=>`${MUSCLES[k]} ${Math.round(100*(1-fat[k]))}%`);
  if(sore.length) html += `<div class="card note"><b>Still recovering:</b> ${sore.join(' · ')}<div class="sub">From your recent sessions. See Body → Recovery.</div></div>`;

  const row = e => `<button class="row dayrow" data-info="${esc(e.name)}">
        <div class="grow"><div style="font-weight:600">${esc(e.name)}</div>
        <div class="sub">${topMuscles(e.name).join(' · ')||'—'}${e.rest?' · rest '+fmtRest(e.rest):''}</div></div>
        <div class="num muted small">${e.sets}×${e.reps} · ${fmt(e.weight)}${S.unit}</div>
      </button>`;
  html += `<div class="card">${groupRuns(day.exercises).map(r=>{
    const rows = day.exercises.slice(r.from, r.to).map(row).join('');
    return r.superset ? `<div class="superset plan"><div class="ss-label">Superset</div>${rows}</div>` : rows;
  }).join('') || '<div class="sub">No exercises yet.</div>'}</div>`;

  html += `<button class="btn" data-start>Start ${esc(day.name)}</button>
    <button class="btn quiet" data-edit>Edit exercises</button></div>`;

  app.innerHTML = html;
  paintBody(document.getElementById('preview'), load);
  wireBodyTaps(document.getElementById('preview'));
  app.querySelector('[data-back]').onclick = ()=>{ route.view = null; render(); };
  app.querySelector('[data-start]').onclick = ()=> startSession(day.id);
  app.querySelectorAll('[data-info]').forEach(b=> b.onclick = ()=> openExerciseInfo(b.dataset.info));
  app.querySelector('[data-edit]').onclick = ()=>{ route.tab='plan'; route.view=null; render(); };
}

/* ---------- SESSION ---------- */

// Most recent logged performance of an exercise, wherever it was done.
// Sessions are newest-first, so the first hit wins.
function lastPerformance(name){
  const c = canon(name);
  for(const s of S.sessions){
    const e = (s.exercises||[]).find(x => canon(x.name) === c);
    if(e && e.sets && e.sets.length) return e.sets;
  }
  return null;
}

// Warm-ups come back as they were. Then working set 1 remembers working set 1,
// set 2 remembers set 2; sets beyond what you did last time inherit the final one.
function prefillSets(name, count, fallback){
  const prev = lastPerformance(name) || [];
  const warm = prev.filter(s=>s.t==='w');
  const work = prev.filter(s=>s.t!=='w');
  const out = warm.map(s=>({weight:s.weight, reps:s.reps, t:'w', done:false}));
  for(let i=0;i<count;i++){
    const p = work.length ? (work[i] || work[work.length-1]) : null;
    const set = {weight: p ? p.weight : fallback.weight, reps: p ? p.reps : fallback.reps, done:false};
    if(p && work[i] && (p.t==='d' || p.t==='f')) set.t = p.t;
    out.push(set);
  }
  return out;
}

function sessionExercise(e){
  const x = {name:e.name, pid:e.id, sets: prefillSets(e.name, e.sets||3, e)};
  if(e.rest) x.rest = e.rest;
  if(e.group) x.group = e.group;
  return x;
}

function startSession(dayId){
  const {day} = findDay(dayId);
  route.view = null;
  S.active = {
    id:uid(), dayId, name:day.name, started:Date.now(),
    exercises: day.exercises.map(sessionExercise)
  };
  save(); route.tab='train'; render(); window.scrollTo(0,0);
}

/* Rest timer.
   Two things matter here:
   - The element is built once and mutated in place. Rebuilding it every second
     replayed the entry animation, which read as a popup flashing on and off.
   - Timing comes from a wall-clock deadline, not a decrementing counter.
     Background tabs get their intervals throttled or frozen, so a counter drifts
     badly; a deadline stays correct no matter how long you were away.
   In the iPhone app the alert is also handed to iOS as a scheduled notification,
   so it fires on time even with the app closed or the phone locked. */
let rest = null, restTick = null;
const REST_NOTE = 4101;

function nextUp(){
  const A = S.active; if(!A) return '';
  for(const e of A.exercises){
    const s = e.sets.find(x=>!x.done);
    if(s) return `Next: ${e.name} · ${fmt(s.weight)} ${S.unit} × ${s.reps}`;
  }
  return 'That was the last set. Finish when ready.';
}
function nextShort(){
  const A = S.active; if(!A) return '';
  for(const e of A.exercises){ const s = e.sets.find(x=>!x.done); if(s) return `${fmt(s.weight)} × ${s.reps}`; }
  return '';
}
function startRest(sec){
  rest = {endsAt: Date.now() + sec*1000, total: sec, alerted:false};
  if(S.active) S.active.rest = rest;      // survives a reload mid-session
  save();
  scheduleRestNote();
  runRest();
}
function restLeft(){
  return rest ? Math.max(0, Math.ceil((rest.endsAt - Date.now())/1000)) : 0;
}
function stopRest(){
  rest = null;
  clearInterval(restTick); restTick = null;
  if(S.active) delete S.active.rest;
  save();
  cancelRestNote();
  const el = document.getElementById('rest'); if(el) el.remove();
  setTimeout(paintBanner, 0);
}
function runRest(){
  clearInterval(restTick);
  restTick = setInterval(tickRest, 250);   // 250ms keeps the display honest
  tickRest();
}
function tickRest(){
  if(!rest || !S.active){ stopRest(); return; }
  const left = restLeft();

  if(left <= 0 && !rest.alerted){
    rest.alerted = true;
    buzz('done');
    notifyRestDone();
    setTimeout(()=>{ if(rest && rest.alerted) stopRest(); }, 2500);
  }
  paintRest(left);
}

// Asked once, on the first tick of a session rather than at launch — a
// permission prompt before you've used anything just gets dismissed.
let notifyAsked = false;
function askNotify(){
  if(notifyAsked) return; notifyAsked = true;
  if(NATIVE){ nat('LocalNotifications','requestPermissions').catch(()=>{}); return; }
  try{
    if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
}

function scheduleRestNote(){
  if(!NATIVE || !rest) return;
  const at = new Date(rest.endsAt), body = nextUp();
  nat('LocalNotifications','cancel',{notifications:[{id:REST_NOTE}]}).catch(()=>{})
    .then(()=> nat('LocalNotifications','schedule',{notifications:[{
      id:REST_NOTE, title:'Rest over', body, schedule:{at, allowWhileIdle:true}
    }]}))
    .catch(e=> console.warn('Could not schedule rest alert', e));
}
function cancelRestNote(){
  if(!NATIVE) return;
  nat('LocalNotifications','cancel',{notifications:[{id:REST_NOTE}]}).catch(()=>{});
}

function notifyRestDone(){
  // In the app, iOS already has the notification scheduled for this moment.
  if(NATIVE) return;
  // On the web this only fires if the page is still alive. iOS suspends
  // backgrounded web apps, so treat it as a bonus, not a guarantee.
  try{
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      new Notification('Rest done', {body:nextUp(), tag:'thermal-rest', silent:false});
    }
  }catch(e){}
}

function paintRest(left){
  if(!rest || !S.active){ const o=document.getElementById('rest'); if(o) o.remove(); return; }
  let el = document.getElementById('rest');
  if(!el){
    el = document.createElement('div');
    el.className = 'resting'; el.id = 'rest';
    el.innerHTML = `<div class="live"></div>
      <div class="grow"><div class="eyebrow" id="rest-label">Rest</div><div class="t num" id="rest-time">0:00</div></div>
      <button class="tag" data-add>+30s</button>
      <button class="tag" data-skip>Skip</button>
      <div class="bar" id="rest-bar"></div>`;
    el.querySelector('[data-add]').onclick = ()=>{
      rest.endsAt += 30000;
      rest.total = Math.max(rest.total, Math.ceil((rest.endsAt-Date.now())/1000));
      rest.alerted = false;
      if(S.active) S.active.rest = rest;
      save(); scheduleRestNote(); tickRest();
    };
    el.querySelector('[data-skip]').onclick = stopRest;
    document.body.classList.add('floating-bar');
    // tapping the bar itself jumps back to the session
    el.querySelector('.grow').onclick = ()=>{
      if(route.tab !== 'train'){ route.tab = 'train'; render(); window.scrollTo(0,0); }
    };
    document.body.appendChild(el);
  }
  const done = left <= 0;
  const m = Math.floor(left/60), s = String(left%60).padStart(2,'0');
  el.querySelector('#rest-time').textContent = done ? 'Go' : `${m}:${s}`;
  el.querySelector('#rest-label').textContent = done ? 'REST OVER' : ('REST' + (nextShort() ? ' · NEXT ' + nextShort() : ''));
  el.querySelector('#rest-bar').style.width = (done ? 0 : 100*left/rest.total) + '%';
  el.style.borderColor = done ? 'var(--ok)' : '#2c3a4e';
}

// Coming back from another app: resync immediately rather than waiting a tick,
// and clear the "Rest over" notification if it already did its job.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(rest && S.active) tickRest();
  if(NATIVE) nat('LocalNotifications','removeAllDeliveredNotifications').catch(()=>{});
});

const fmtRest = sec => sec % 60 ? `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}` : `${sec/60} min`;
const SET_LABEL = {w:'W', d:'D', f:'F'};
const SET_NAME  = {w:'Warm-up', d:'Drop set', f:'To failure'};

/* Double progression. The plan's rep number is the top of the range: once every
   working set last time reached it (at the same weight or more), suggest the next
   jump — 2.5 kg / 5 lb, or two more reps on a bodyweight move. Shown until you
   apply it, dismiss it, or start working sets. */
function progressionFor(ex){
  if(ex.noNudge) return null;
  const p = planExFor(ex); if(!p || !(+p.reps > 0)) return null;
  const cur = ex.sets.filter(s=>s.t!=='w');
  if(!cur.length || cur.some(s=>s.done)) return null;
  const prev = (lastPerformance(ex.name)||[]).filter(s=>s.t!=='w');
  if(!prev.length) return null;
  const target = +p.reps, w = Math.max(...prev.map(s=>+s.weight||0));
  if(!prev.every(s=>(+s.reps||0) >= target && (+s.weight||0) >= w)) return null;
  if(w > 0){
    const to = round1(w + (S.unit==='kg' ? 2.5 : 5));
    if(cur.every(s=>+s.weight >= to)) return null;
    return {kind:'weight', to, text:`${target} reps on every set last time. Try <b>${fmt(to)} ${S.unit}</b>.`};
  }
  const to = target + 2;
  if(cur.every(s=>+s.reps >= to)) return null;
  return {kind:'reps', to, text:`${target} reps on every set last time. Try <b>${to} reps</b>.`};
}

let currentSet = null;   // [exercise index, set index] of the next set to do
function exCard(e, ei, load, maxL, inSS){
  const m = musclesFor(e.name);
  const prim = Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
  const c = prim ? heat(0.2+0.8*((load[prim[0]]||0)/maxL)) : '#2a3444';
  let n = 0;
  return `<div class="card ${inSS?'in-ss':''}" data-ex="${ei}">
    <div class="exhead">
      <span class="exdot ${prim && load[prim[0]] ? 'lit' : ''}" style="background:${c};color:${c}"></span>
      <button class="grow exname" data-hist>
        <div class="title">${esc(e.name)}</div>
        <div class="sub">${topMuscles(e.name).join(' · ')||'Custom'} · rest ${fmtRest(e.rest||S.restDefault)}</div>
      </button>
      <button class="iconbtn" data-menu aria-label="Options for ${esc(e.name)}">${DOTS}</button>
    </div>
    ${(()=>{ const n = progressionFor(e); return n ? `<div class="nudge" role="note">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--amber);flex:none"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <span class="grow">${n.text}</span>
      <button class="go" data-apply>Apply</button><button class="x" data-nonudge aria-label="Dismiss suggestion">×</button></div>` : ''; })()}
    <div class="setrow head"><div>Set</div><div>${S.unit}</div><div>Reps</div><div></div></div>
    ${e.sets.map((s,si)=>`
      <div class="setwrap"><button class="setdel" data-del="${si}" tabindex="-1">Delete</button>
      <div class="setrow ${s.done?'done':''} ${s.t?'t-'+s.t:''} ${currentSet && currentSet[0]===ei && currentSet[1]===si ? 'current':''}" data-set="${si}">
        <button class="setno" data-type aria-label="${s.t?SET_NAME[s.t]:'Working set'}, tap to change">${s.t?SET_LABEL[s.t]:++n}</button>
        <div class="stepper">
          <button data-step="w" data-d="-1" aria-label="Less weight">−</button>
          <input inputmode="decimal" data-f="weight" value="${s.weight}" aria-label="Weight">
          <button data-step="w" data-d="1" aria-label="More weight">+</button>
        </div>
        <div class="stepper">
          <button data-step="r" data-d="-1" aria-label="Fewer reps">−</button>
          <input inputmode="numeric" data-f="reps" value="${s.reps}" aria-label="Reps">
          <button data-step="r" data-d="1" aria-label="More reps">+</button>
        </div>
        <button class="tick" data-tick aria-label="Done">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </button>
      </div></div>`).join('')}
    <button class="btn quiet" data-addset style="padding:10px 0 2px">+ Add set</button>
  </div>`;
}

// Runs of neighbouring exercises that share a group id render as one superset.
function groupRuns(list){
  const runs = []; let i = 0;
  while(i < list.length){
    const g = list[i].group; let j = i+1;
    if(g) while(j < list.length && list[j].group === g) j++;
    runs.push({from:i, to:j, superset: !!g && j-i > 1});
    i = j;
  }
  return runs;
}

function renderSession(){
  const A = S.active;
  const load = sessionLoad(A);
  const maxL = Math.max(0.0001,...Object.values(load));
  const total = doneSets(A), all = A.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.t!=='w').length,0);
  const mins = Math.floor((Date.now()-A.started)/60000);

  let html = `<div class="topbar">
    <div class="grow"><div class="eyebrow"><span style="color:var(--ok)">●</span> In progress · ${mins}m</div>
    <h1>${esc(A.name)}</h1></div>
    <button class="tag finish" data-finish>Finish</button>
  </div><div class="screen">`;

  html += `<div class="card"><div class="stat">
    <div><div class="k">Sets</div><div class="v">${total}<span class="dim" style="font-size:13px">/${all}</span></div></div>
    <div><div class="k">Volume</div><div class="v">${Math.round(tonnage(A)).toLocaleString()}<span class="dim" style="font-size:11px"> ${S.unit}</span></div></div>
    <div><div class="k">Time</div><div class="v">${mins}<span class="dim" style="font-size:13px">m</span></div></div>
  </div>${S.hintTypes ? '' : `<div class="hint">Tap a set number to mark it as a warm-up (W), drop set (D) or to failure (F). Swipe a set left to delete it. Warm-ups don't count toward heat or records.</div>`}</div>`;

  currentSet = null;
  for(let i=0;i<A.exercises.length && !currentSet;i++){ const j = A.exercises[i].sets.findIndex(x=>!x.done); if(j>=0) currentSet = [i,j]; }
  groupRuns(A.exercises).forEach(r=>{
    if(r.superset){
      html += `<div class="superset"><div class="ss-label">Superset · rest after ${esc(A.exercises[r.to-1].name)}</div>`;
      for(let k=r.from;k<r.to;k++) html += exCard(A.exercises[k], k, load, maxL, true);
      html += `</div>`;
    } else html += exCard(A.exercises[r.from], r.from, load, maxL, false);
  });

  html += `<button class="btn ghost" data-addex-live>+ Add exercise</button>
    <button class="btn quiet" data-cancel style="margin-top:4px">Discard session</button></div>`;
  // Re-rendering the session you're already looking at (ticking a set, adding
  // one) shouldn't replay the screen's fade-in.
  const same = !!app.querySelector('[data-finish]');
  app.innerHTML = html;
  if(same) app.querySelector('.screen').classList.add('still');
  if(rest) tickRest();
  wireSession();
}

// In a superset, finishing a set on any exercise but the last moves you on
// without resting; the rest comes after the last exercise in the round.
function restAfter(ei){
  const A = S.active, e = A.exercises[ei], next = A.exercises[ei+1];
  if(e.group && next && next.group === e.group) return {skip:true, next:next.name};
  return {sec: e.rest || S.restDefault};
}

/* Swipe a set row left to reveal Delete. A mostly-horizontal drag only, so
   scrolling the page still works; starting a drag elsewhere closes any open row. */
function swipeToDelete(row){
  const wrap = row.parentElement;
  let sx = 0, sy = 0, dx = 0, on = false;
  row.addEventListener('touchstart', e=>{
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; on = false;
    document.querySelectorAll('.setwrap.swiped').forEach(w=>{ if(w !== wrap) w.classList.remove('swiped'); });
  }, {passive:true});
  row.addEventListener('touchmove', e=>{
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if(!on && Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my)*1.5) on = true;
    if(on){
      const base = wrap.classList.contains('swiped') ? -92 : 0;
      dx = Math.min(0, Math.max(-110, base + mx));
      row.style.transition = 'none'; row.style.transform = `translateX(${dx}px)`;
    }
  }, {passive:true});
  row.addEventListener('touchend', ()=>{
    if(!on) return;
    row.style.transition = ''; row.style.transform = '';
    wrap.classList.toggle('swiped', dx < -50);
  });
}

function wireSession(){
  const A = S.active;
  app.querySelectorAll('[data-ex]').forEach(card=>{
    const ei = +card.dataset.ex, ex = A.exercises[ei];
    card.querySelector('[data-addset]').onclick = ()=>{
      const work = ex.sets.filter(s=>s.t!=='w');
      const last = work.slice(-1)[0] || ex.sets.slice(-1)[0] || {weight:0,reps:8};
      ex.sets.push({weight:last.weight, reps:last.reps, done:false});
      save(); renderSession();
    };
    card.querySelector('[data-hist]').onclick = ()=> openExerciseInfo(ex.name);
    const ap = card.querySelector('[data-apply]');
    if(ap) ap.onclick = ()=>{
      const n = progressionFor(ex), p = planExFor(ex); if(!n) return;
      ex.sets.forEach(s=>{ if(s.t!=='w' && !s.done){ if(n.kind==='weight') s.weight = n.to; else s.reps = n.to; } });
      if(p){ if(n.kind==='weight') p.weight = n.to; else p.reps = n.to; }   // the plan moves up too
      ex.noNudge = true; buzz('medium'); save(); renderSession();
    };
    const nn = card.querySelector('[data-nonudge]');
    if(nn) nn.onclick = ()=>{ ex.noNudge = true; save(); renderSession(); };
    card.querySelector('[data-menu]').onclick = ()=> exerciseMenu(ei);
    card.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{
      ex.sets.splice(+b.dataset.del, 1); buzz('medium'); save(); renderSession();
    });
    card.querySelectorAll('[data-set]').forEach(row=>{
      const si = +row.dataset.set, set = ex.sets[si];
      swipeToDelete(row);
      row.querySelector('[data-type]').onclick = ()=>{
        const order = [undefined,'w','d','f'];
        const nt = order[(order.indexOf(set.t)+1) % order.length];
        if(nt) set.t = nt; else delete set.t;
        S.hintTypes = true;
        buzz(); save(); renderSession();
      };
      row.querySelectorAll('[data-step]').forEach(b=>{
        b.onclick = ()=>{
          const d = +b.dataset.d;
          const inc = S.unit==='kg' ? 1.25 : 2.5;
          if(b.dataset.step==='w') set.weight = Math.max(0, Math.round((+set.weight + d*inc)*100)/100);
          else set.reps = Math.max(0, (+set.reps) + d);
          row.querySelector('[data-f="weight"]').value = set.weight;
          row.querySelector('[data-f="reps"]').value = set.reps;
          buzz();
          save();
        };
      });
      row.querySelectorAll('input').forEach(inp=>{
        inp.onfocus = ()=> inp.select();
        inp.oninput = ()=>{ set[inp.dataset.f] = inp.value.replace(/[^\d.]/g,''); save(); };
        inp.onblur  = ()=>{ set[inp.dataset.f] = +set[inp.dataset.f] || 0; inp.value = set[inp.dataset.f]; save(); };
      });
      row.querySelector('[data-tick]').onclick = ()=>{
        set.done = !set.done;
        set.weight = +set.weight||0; set.reps = +set.reps||0;
        save();
        if(set.done){
          buzz('medium');
          askNotify();
          if(set.t !== 'w'){
            if(+set.weight > 0){
              const prev = bestE1rm(ex.name, A.id), now = e1rm(set.weight, set.reps);
              if(prev > 0 && now > prev + 1e-9) toast(`New record · est. 1RM ${fmt(round1(now))} ${S.unit}`, 'pr');
            } else {
              const prev = bestReps(ex.name, A.id);
              if(prev > 0 && +set.reps > prev) toast(`New record · ${set.reps} reps`, 'pr');
            }
          }
          const r = restAfter(ei);
          if(r.skip){ stopRest(); toast(`Superset · on to ${r.next}`); }
          else startRest(r.sec);
        }
        renderSession();
      };
    });
  });
  app.querySelector('[data-finish]').onclick = finishSession;
  app.querySelector('[data-addex-live]').onclick = addExerciseLive;
  app.querySelector('[data-cancel]').onclick = ()=>{
    confirmSheet('Discard this session?','Nothing will be saved to your log.','Discard',()=>{
      stopRest(); S.active=null; save(); render();
    });
  };
}

// The plan exercise a session exercise came from, so changes can stick.
function planExFor(sx){
  if(!sx.pid || !S.active) return null;
  const f = findDay(S.active.dayId); if(!f) return null;
  return f.day.exercises.find(x=>x.id===sx.pid) || null;
}

// Link list[i] with list[i+1] into one superset (or unlink list[i]).
function linkNext(list, i){
  const a = list[i], b = list[i+1]; if(!b) return;
  const g = a.group || b.group || uid();
  a.group = g; b.group = g;
}
function unlink(list, i){
  if(!list[i] || !list[i].group) return;
  delete list[i].group;
  tidyGroups(list);
}
// A "superset" of one is just an exercise.
function tidyGroups(list){
  groupRuns(list).forEach(r=>{ if(!r.superset && list[r.from].group) delete list[r.from].group; });
}

function exerciseMenu(ei){
  const A = S.active, ex = A.exercises[ei], next = A.exercises[ei+1];
  const linked = ex.group && ((next && next.group===ex.group) || (A.exercises[ei-1]||{}).group===ex.group);
  const restOpts = [0,60,90,120,150,180,240];
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px">${esc(ex.name)}</div>
    <div class="sub" style="margin:4px 0 16px">${topMuscles(ex.name,4).join(' · ')||'Custom exercise'}</div>
    <div class="menu">
      <button data-a="hist">History &amp; records</button>
      <button data-a="warm">Add warm-up sets</button>
      ${ex.sets.length ? '<button data-a="pop">Remove last set</button>' : ''}
      ${isPlateLoaded(ex.name) ? '<button data-a="plates">Plate calculator</button>' : ''}
      ${linked ? '<button data-a="unlink">Remove from superset</button>'
        : next ? `<button data-a="link">Superset with ${esc(next.name)}</button>` : ''}
      ${ei>0 ? '<button data-a="up">Move up</button>' : ''}
      ${next ? '<button data-a="down">Move down</button>' : ''}
    </div>
    <div class="field" style="margin-top:16px"><label>Rest after each set</label>
      <div class="chips wrap">${restOpts.map(v=>{
        const on = v ? ex.rest===v : !ex.rest;
        return `<button class="chip ${on?'on':''}" data-rest="${v}">${v ? fmtRest(v) : 'Default · '+fmtRest(S.restDefault)}</button>`;
      }).join('')}</div>
    </div>
    <button class="btn quiet danger" data-a="remove">Remove from this session</button>`);

  const stick = (fn)=>{ const p = planExFor(ex); if(p) fn(p); };
  sh.querySelectorAll('[data-rest]').forEach(b=> b.onclick = ()=>{
    const v = +b.dataset.rest;
    if(v) ex.rest = v; else delete ex.rest;
    stick(p=>{ if(v) p.rest = v; else delete p.rest; });   // remembered for next time
    save(); close(); renderSession();
  });
  sh.querySelectorAll('[data-a]').forEach(b=> b.onclick = ()=>{
    const a = b.dataset.a;
    if(a==='hist'){ close(); openExerciseInfo(ex.name); return; }
    if(a==='warm'){ close(); warmupSheet(ei); return; }
    if(a==='plates'){ close(); plateSheet(topWeight(ex), ex.name); return; }
    if(a==='pop') ex.sets.pop();
    if(a==='link'){
      linkNext(A.exercises, ei);
      const f = findDay(A.dayId), pa = planExFor(ex), pb = planExFor(next);
      if(f && pa && pb){
        const L = f.day.exercises, ia = L.indexOf(pa), ib = L.indexOf(pb);
        if(ib === ia+1) linkNext(L, ia);
      }
    }
    if(a==='unlink'){
      unlink(A.exercises, ei);
      const f = findDay(A.dayId), p = planExFor(ex);
      if(f && p) unlink(f.day.exercises, f.day.exercises.indexOf(p));
    }
    if(a==='up' || a==='down'){
      const j = a==='up' ? ei-1 : ei+1;
      [A.exercises[ei], A.exercises[j]] = [A.exercises[j], A.exercises[ei]];
    }
    if(a==='remove'){
      close();
      confirmSheet(`Remove ${ex.name}?`,'Its sets in this session are dropped. Your plan is unchanged.','Remove',()=>{
        A.exercises.splice(ei,1); tidyGroups(A.exercises); save(); renderSession();
      });
      return;
    }
    save(); close(); renderSession();
  });
}

const topWeight = ex => Math.max(0, ...ex.sets.filter(s=>s.t!=='w').map(s=>+s.weight||0));

function finishSession(){
  const A = S.active;
  if(doneSets(A)===0){
    confirmSheet('No working sets logged','Finish anyway and this session is dropped.','Finish',()=>{
      stopRest(); S.active=null; save(); render();
    });
    return;
  }
  A.ended = Date.now();
  A.exercises = A.exercises.map(e=>{
    const x = {name:e.name, sets:e.sets.filter(s=>s.done)};
    if(e.group) x.group = e.group;
    return x;
  }).filter(e=>e.sets.length);
  delete A.rest;
  S.sessions.unshift(A);
  stopRest(); S.active = null;
  save();
  buzz('done');
  openSummary(A.id);
}

/* Pull a finished session back out of the log and carry on with it.
   Everything already logged comes back ticked. */
function resumeSession(id){
  if(S.active) return;
  const i = S.sessions.findIndex(s=>s.id===id);
  if(i < 0) return;
  const s = S.sessions.splice(i,1)[0];
  delete s.ended; delete s.rest;
  s.exercises.forEach(e=> e.sets.forEach(x=> x.done = true));
  S.active = s;
  save(); route.tab='train'; render(); window.scrollTo(0,0);
}

/* A session left open on another tab shouldn't be easy to forget about. */
function paintBanner(){
  const old = document.getElementById('inprog'); if(old) old.remove();
  document.body.classList.toggle('floating-bar', !!(S.active && (rest || route.tab !== 'train')));
  if(!S.active || route.tab === 'train' || rest) return;
  const el = document.createElement('div');
  el.className = 'resting'; el.id = 'inprog';
  el.innerHTML = `<div class="live"></div>
    <div class="grow"><div class="eyebrow">In progress</div>
      <div style="font-weight:700">${esc(S.active.name)}</div></div>
    <span class="tag">Resume</span>`;
  el.onclick = ()=>{ route.tab='train'; render(); window.scrollTo(0,0); };
  document.body.appendChild(el);
}

/* ---------- BODY ---------- */
/* Two views of the same body:
   Heat      — where your sets landed over a window, relative to your busiest muscle.
   Recovery  — an estimate of how fatigued each muscle still is. Each session's sets
               on a muscle (capped at 8) set its starting fatigue, which fades in a
               straight line: about 2 days for a light dose, 6 for a hard one.
               Like Fitbod's view, it's a guide, not a measurement. */
let bodyRange = 7, bodyMode = 'heat';
const RECOVER_MAX_H = 144;

function fatigueAt(now){
  const fat = {};
  const add = (L, h)=>{
    if(h < 0 || h > RECOVER_MAX_H) return;
    for(const k in L){
      const f0 = Math.min(1, L[k]/8), T = 48 + 96*f0;
      const f = f0 * Math.max(0, 1 - h/T);
      if(f > 0) fat[k] = Math.min(1, (fat[k]||0) + f);
    }
  };
  if(S.active) add(sessionLoad(S.active), (now - S.active.started)/36e5);
  S.sessions.forEach(s=> add(sessionLoad(s), (now - (s.ended||s.started))/36e5));
  return fat;
}
const FRESH = 0.15;
function hoursUntilFresh(k){
  for(let h=3; h<=RECOVER_MAX_H; h+=3) if((fatigueAt(Date.now()+h*36e5)[k]||0) < FRESH) return h;
  return RECOVER_MAX_H;
}
const inHours = h => h < 20 ? `${Math.max(1,Math.round(h))}h` : `${Math.round(h/24)}d`;

/* ---------- weekly sets against a target ----------
   Sets in the last 7 days, counted the same way as heat: a working set adds its
   full weight to the main muscle and a share to helpers (a bench set is 1 chest,
   0.6 triceps). Targets are common starting points — roughly 10–20 hard sets a
   week grows most muscles, ~6 maintains — and each can be changed per muscle. */
const TARGETS = {
  chest:[10,20], lats:[10,20], upper_back:[10,20], quads:[10,20], hamstrings:[8,16], glutes:[8,16],
  front_delts:[6,12], side_delts:[10,20], rear_delts:[8,16], biceps:[8,16], triceps:[8,16], traps:[6,12],
  calves:[8,16], abs:[6,16], obliques:[4,12], forearms:[4,12], lower_back:[4,10], neck:[0,8],
  adductors:[4,12], abductors:[4,12]
};
const targetFor = k => (S.targets && S.targets[k]) || TARGETS[k] || [6,12];
function weeklySets(now = Date.now()){
  const cut = now - 7*864e5;
  const loads = S.sessions.filter(s=>(s.ended||s.started) >= cut).map(sessionLoad);
  if(S.active) loads.push(sessionLoad(S.active));
  return mergeLoads(loads);
}
const weekStatus = (v, [lo,hi]) => v < lo ? 'under' : v > hi ? 'over' : 'on';
const STATUS = {under:'Under', on:'On target', over:'Over'};
const half = v => Math.round(v*2)/2;

function weekRow(k, v){
  const [lo,hi] = targetFor(k), st = weekStatus(v,[lo,hi]);
  const scale = Math.max(hi*1.25, v, 1);
  return `<button class="wk" data-muscle="${k}">
    <span class="wk-n">${MUSCLES[k]}</span>
    <span class="wk-t" aria-hidden="true">
      <i class="band" style="left:${100*lo/scale}%;width:${100*(hi-lo)/scale}%"></i>
      <i class="fill ${st}" style="width:${Math.min(100,100*v/scale)}%"></i>
    </span>
    <span class="wk-v"><b class="${st}">${fmt(half(v))}</b> / ${lo}–${hi}</span>
  </button>`;
}

function renderBody(){
  const rec = bodyMode === 'rec', wk = bodyMode === 'week';
  let html = head(rec ? 'What’s ready to train' : wk ? 'Last 7 days vs your targets' : 'Where the work landed',
                  rec ? 'Recovery' : wk ? 'Weekly sets' : 'Body heat');
  html += `<div class="screen">
    <div class="seg three" role="tablist">
      <button role="tab" class="${!rec&&!wk?'on':''}" data-mode="heat">Heat</button>
      <button role="tab" class="${rec?'on':''}" data-mode="rec">Recovery</button>
      <button role="tab" class="${wk?'on':''}" data-mode="week">Weekly</button>
    </div>`;

  if(wk){
    const ws = weeklySets(), keys = Object.keys(MUSCLES);
    const counts = {under:0, on:0, over:0};
    keys.forEach(k=> counts[weekStatus(ws[k]||0, targetFor(k))]++);
    html += `<div class="card hud">${bodyMap({},{id:'heatmap'})}
      <div class="legend"><span>None</span><div class="ramp"></div><span>At target max</span></div></div>
      <div class="card"><div class="stat">
        <div><div class="k">On target</div><div class="v" style="color:var(--ok)">${counts.on}</div></div>
        <div><div class="k">Under</div><div class="v" style="color:var(--cyan)">${counts.under}</div></div>
        <div><div class="k">Over</div><div class="v" style="color:var(--amber)">${counts.over}</div></div>
      </div></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">Sets this week · target range</div>
        ${keys.map(k=>weekRow(k, ws[k]||0)).join('')}</div>
      <div class="sub" style="padding:0 4px">Helper muscles count partly — a bench set is 1 for chest and 0.6 for triceps. Targets are common starting points (about 10–20 hard sets a week grows most muscles, around 6 keeps what you have). Tap a muscle to change its target.</div>
    </div>`;
    app.innerHTML = html;
    const lv = {};
    keys.forEach(k=>{ const v = ws[k]||0; if(v > 0) lv[k] = Math.max(.12, Math.min(1, v / targetFor(k)[1])); });
    paintLevels(document.getElementById('heatmap'), lv);
    wireBodyTaps(document.getElementById('heatmap'));
    app.querySelectorAll('[data-muscle]').forEach(b=> b.onclick = ()=> muscleSheet(b.dataset.muscle));
    app.querySelectorAll('[data-mode]').forEach(b=> b.onclick = ()=>{ bodyMode = b.dataset.mode; renderBody(); });
    return;
  }

  if(rec){
    const fat = fatigueAt(Date.now());
    const tired = Object.entries(fat).filter(([,f])=>f>=FRESH).sort((a,b)=>b[1]-a[1]);
    const ready = Object.keys(MUSCLES).filter(k=>(fat[k]||0) < FRESH);
    html += `<div class="card hud">${bodyMap({},{id:'heatmap'})}
      <div class="legend"><span>Fresh</span><div class="ramp"></div><span>Fatigued</span></div></div>`;
    if(!tired.length){
      html += `<div class="empty"><b>Everything’s fresh</b>Nothing you’ve trained in the last few days is still recovering.</div>`;
    } else {
      html += `<div class="card"><div class="eyebrow" style="margin-bottom:12px">Still recovering</div>
        <div class="rank wide">${tired.map(([k,f])=>`
          <div class="r"><div class="nm">${MUSCLES[k]}</div>
          <div class="tr"><i style="width:${Math.round(100*(1-f))}%;background:${heat(0.1+0.9*f)}"></i></div>
          <div class="vl">${Math.round(100*(1-f))}% · ${inHours(hoursUntilFresh(k))}</div></div>`).join('')}</div>
        <div class="sub" style="margin-top:12px">Bar shows how recovered each muscle is, then roughly how long until it’s fresh.</div></div>`;
    }
    html += `<div class="card"><div class="eyebrow" style="margin-bottom:8px">Ready to train</div>
      <div class="small muted">${ready.map(k=>MUSCLES[k]).join(' · ') || 'Nothing yet — give it a day.'}</div></div>
      <div class="sub" style="padding:0 4px">An estimate from your logged sets: a hard session (8+ sets for a muscle) takes about 6 days to clear, a light one about 2. Warm-ups don’t count.</div>`;
    html += '</div>';
    app.innerHTML = html;
    const root = document.getElementById('heatmap'), lv = {};
    for(const k in fat) if(fat[k] > 0.02) lv[k] = 0.1 + 0.9*fat[k];
    paintLevels(root, lv);
    wireBodyTaps(root);
  } else {
    const cut = Date.now() - bodyRange*864e5;
    const recent = S.sessions.filter(s=>(s.ended||s.started) >= cut);
    const load = mergeLoads(recent.map(sessionLoad));
    const has = Object.keys(load).length>0;
    const max = Math.max(0.0001,...Object.values(load));
    const ranked = Object.entries(load).sort((a,b)=>b[1]-a[1]);
    const cold = Object.keys(MUSCLES).filter(k=>!load[k]);
    html = html.replace('<h1>Body heat</h1></div>', `<h1>Body heat</h1></div><div class="num small muted" style="text-align:right;line-height:1.5">${recent.reduce((n,s)=>n+doneSets(s),0)} sets<br>${(recent.reduce((n,s)=>n+tonnage(s),0)/1000).toFixed(1)}k ${S.unit}</div>`);
    html += `<div class="chips">
        ${[[7,'7 days'],[14,'14 days'],[30,'30 days'],[9999,'All time']].map(([d,l])=>
          `<button class="chip ${bodyRange===d?'on':''}" data-range="${d}">${l}</button>`).join('')}
      </div>
      <div class="card hud">
        ${bodyMap(load,{id:'heatmap'})}
        <div class="legend"><span>Light</span><div class="ramp"></div><span>Heavy</span></div>
      </div>`;
    if(!has){
      html += `<div class="empty"><b>Nothing logged yet</b>Finish a session and your muscles light up here.</div>`;
    }else{
      html += `<div class="card">
        <div class="eyebrow" style="margin-bottom:12px">Sets per muscle · tap the body for detail</div>
        <div class="rank">${ranked.map(([k,v])=>`
          <div class="r"><div class="nm">${MUSCLES[k]}</div>
          <div class="tr" style="overflow:visible"><i style="width:${Math.round(100*v/max)}%;background:${heat(0.14+0.86*v/max)};${v/max>.85?`box-shadow:0 0 12px ${heat(1)}80`:''}"></i></div>
          <div class="vl">${fmt(round1(v))}</div></div>`).join('')}</div>
      </div>`;
      if(cold.length) html += `<div class="card"><div class="eyebrow" style="margin-bottom:8px">Untouched</div>
        <div class="small muted">${cold.map(k=>MUSCLES[k]).join(' · ')}</div></div>`;
    }
    html += '</div>';
    app.innerHTML = html;
    paintBody(document.getElementById('heatmap'), load);
    wireBodyTaps(document.getElementById('heatmap'));
    app.querySelectorAll('[data-range]').forEach(b=> b.onclick = ()=>{ bodyRange=+b.dataset.range; renderBody(); });
  }
  app.querySelectorAll('[data-mode]').forEach(b=> b.onclick = ()=>{ bodyMode = b.dataset.mode; renderBody(); });
}

/* ---------- LOG ---------- */
function ago(ts){
  const d = Math.floor((Date.now()-ts)/864e5);
  if(d<=0) return 'today'; if(d===1) return 'yesterday';
  if(d<7) return d+'d ago'; if(d<35) return Math.round(d/7)+'w ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
const setText = x => `${x.t?`<i class="st t-${x.t}">${SET_LABEL[x.t]}</i>`:''}${fmt(x.weight)}×${x.reps}`;

function openSummary(id){
  route.tab = 'log'; route.view = 'sum:' + id; render(); window.scrollTo(0,0);
}
function recordText(r){
  return r.kind === 'e1rm'
    ? `est. 1RM ${fmt(round1(r.value))} ${S.unit} <span class="up">+${fmt(round1(r.value - r.prev))}</span>`
    : `${r.value} reps <span class="up">+${r.value - r.prev}</span>`;
}
function renderSummary(id){
  const s = S.sessions.find(x=>x.id===id);
  if(!s){ route.view = null; return renderLog(); }
  const recs = recordsBySession().get(id) || [];
  const load = sessionLoad(s), ranked = Object.entries(load).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(0.0001, ...Object.values(load));
  const mins = Math.max(1, Math.round(((s.ended||s.started) - s.started)/60000));
  const when = new Date(s.ended||s.started).toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
  const lead = recs.length ? `${recs.length} new record${recs.length===1?'':'s'}.` : 'Logged.';
  const hot = ranked[0] ? ` ${MUSCLES[ranked[0][0]]} took the most work.` : '';
  let html = `<div class="topbar">
    <button data-back aria-label="Back to log" style="color:var(--muted);margin-right:2px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="grow"><div class="eyebrow" style="color:var(--ok)">Workout complete · ${esc(when)}</div><h1>${esc(s.name)}</h1></div>
  </div><div class="screen">
    <div class="sub" style="font-size:14px;margin:-4px 0 14px">${lead}${hot}</div>

/* ---------- share a workout as an image ----------
   Drawn as one SVG (body paths included), rasterised on a canvas, then handed
   to the share sheet. THEME holds the colours so a restyle changes it too. */
const THEME = {ground:'#07090d', card:'#0f141d', text:'#e9eef7', muted:'#8796ae', accent:'#ffb02e',
  ok:'#49d69d', base:'#1d2534', skin:'#131923', font:"'Helvetica Neue', Helvetica, Arial, sans-serif"};

function bodyArt(levels, x, y, h){
  const sc = h / 1268; let out = '';
  ['front','back'].forEach((view, i)=>{
    const vb = BODY[view].vb.split(' ').map(Number);
    let glow = '', fig = '';
    BODY[view].parts.forEach(([m, d])=>{
      if(!m){ fig += `<path d="${d}" fill="${THEME.skin}"/>`; return; }
      const t = levels[m] || 0, c = t > 0 ? heat(t) : THEME.base;
      fig += `<path d="${d}" fill="${c}"/>`;
      if(t >= .5) glow += `<path d="${d}" fill="${c}" opacity="${Math.min(.8, t-.35).toFixed(2)}"/>`;
    });
    const tx = x + i*(650+60)*sc;
    out += `<g transform="translate(${tx.toFixed(1)} ${y}) scale(${sc.toFixed(4)}) translate(${-vb[0]} ${-vb[1]})"><g filter="url(#sg)">${glow}</g>${fig}</g>`;
  });
  return out;
}
function summarySvg(s){
  const W = 1080, H = 1350, T = THEME;
  const load = sessionLoad(s), max = Math.max(0.0001, ...Object.values(load)), lv = {};
  for(const k in load) if(load[k] > 0) lv[k] = 0.14 + 0.86*load[k]/max;
  const recs = recordsBySession().get(s.id) || [];
  const mins = Math.max(1, Math.round(((s.ended||s.started) - s.started)/60000));
  const when = new Date(s.ended||s.started).toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
  const bodyH = 700, bodyW = (1360/1268)*bodyH, bx = (W - bodyW)/2;
  const stats = [[mins+'m','Duration'],[String(doneSets(s)),'Working sets'],[Math.round(tonnage(s)).toLocaleString()+' '+S.unit,'Volume']];
  const recLines = recs.slice(0,3).map((r,i)=>`<text x="80" y="${1185 + i*52}" font-size="34" fill="${T.text}" font-weight="600">${esc(r.name)}</text>
    <text x="${W-80}" y="${1185 + i*52}" font-size="32" fill="${T.accent}" text-anchor="end" font-weight="700">${r.kind==='e1rm' ? 'e1RM '+fmt(round1(r.value))+' '+S.unit : r.value+' reps'}</text>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${T.font}">
    <defs><filter id="sg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter></defs>
    <rect width="${W}" height="${H}" fill="${T.ground}"/>
    <text x="80" y="110" font-size="28" letter-spacing="6" fill="${T.accent}" font-weight="700">THERMAL</text>
    <text x="${W-80}" y="110" font-size="28" fill="${T.muted}" text-anchor="end">${esc(when)}</text>
    <text x="80" y="210" font-size="88" fill="${T.text}" font-weight="800">${esc(s.name)}</text>
    ${stats.map(([v,k],i)=>`<text x="${80 + i*320}" y="300" font-size="52" fill="${T.text}" font-weight="700">${esc(v)}</text>
      <text x="${80 + i*320}" y="340" font-size="24" letter-spacing="3" fill="${T.muted}">${k.toUpperCase()}</text>`).join('')}
    ${bodyArt(lv, bx, 390, bodyH)}
    ${recs.length ? `<text x="80" y="1125" font-size="26" letter-spacing="4" fill="${T.muted}">${recs.length} NEW RECORD${recs.length===1?'':'S'}</text>${recLines}`
      : `<text x="${W/2}" y="1180" font-size="30" fill="${T.muted}" text-anchor="middle">${doneSets(s)} working sets logged</text>`}
  </svg>`;
}
function svgToPng(svg, w, h){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/png');
      c.toBlob(blob => resolve({blob, base64: dataUrl.split(',')[1]}), 'image/png');
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function shareSummary(s){
  const name = `thermal-${(s.name||'workout').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${stamp()}.png`;
  try{
    const png = await svgToPng(summarySvg(s), 1080, 1350);
    if(NATIVE){
      const r = await nat('Filesystem','writeFile',{path:name, data:png.base64, directory:'CACHE'});
      await nat('Share','share',{title:s.name, files:[r.uri]});
      return;
    }
    const file = new File([png.blob], name, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:s.name}); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(png.blob), a = document.createElement('a');
    a.href = url; a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){
    if(!/cancel/i.test(String(err && (err.message || err)))) toast('Couldn’t make the image');
  }
}
