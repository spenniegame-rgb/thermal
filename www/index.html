/* ---------- warm-up and plate calculators ---------- */
const STEP = () => S.unit==='kg' ? 2.5 : 5;
const barWeight = () => S.unit==='kg' ? S.barKg : S.barLb;
const usesBar = name => { const e = libEntry(name); return !e || ['barbell','smith','ezbar'].includes(e.eq); };
// EZ bars are lighter than an Olympic bar; everything else uses your bar setting.
const isEz = name => (libEntry(name)||{}).eq === 'ezbar';
const barFor = name => !usesBar(name) ? 0 : isEz(name) ? (S.unit==='kg' ? 10 : 25) : barWeight();

// 40% × 8, 60% × 5, 80% × 3 of your top working weight, rounded to loadable
// jumps. Barbell lifts start with the empty bar when there's room for it.
function warmupPlan(top, name){
  if(!(top > 0)) return [];
  const step = STEP(), bar = barFor(name);
  const r = w => Math.round(w/step)*step;
  const out = [];
  if(bar && top > bar*1.6) out.push({weight:bar, reps:10});
  [[.4,8],[.6,5],[.8,3]].forEach(([p,reps])=>{
    const w = Math.max(r(top*p), bar);
    if(w > 0 && w < top && !out.some(x=>x.weight===w)) out.push({weight:w, reps});
  });
  return out;
}

function warmupSheet(ei){
  const ex = S.active.exercises[ei];
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px">Warm-up sets</div>
    <div class="sub" style="margin:4px 0 16px">Ramps up to your working weight. Warm-ups are marked W and don’t count toward heat or records.</div>
    <div class="field"><label>Working weight · ${S.unit}</label><input id="wu-w" inputmode="decimal" value="${topWeight(ex)||''}"></div>
    <div id="wu-list" style="margin-bottom:16px"></div>
    <button class="btn" data-go>Add warm-ups</button>
    <button class="btn quiet" data-cancel>Cancel</button>`);
  const inp = sh.querySelector('#wu-w'), list = sh.querySelector('#wu-list'), go = sh.querySelector('[data-go]');
  let plan = [];
  const draw = ()=>{
    const top = +inp.value || 0;
    plan = warmupPlan(top, ex.name);
    list.innerHTML = plan.length
      ? plan.map(s=>`<div class="row wu"><span class="st t-w">W</span><span class="num grow">${fmt(s.weight)} ${S.unit} × ${s.reps}</span><span class="dim small num">${Math.round(100*s.weight/top)}%</span></div>`).join('')
      : `<div class="sub">${top ? 'That’s light enough to skip warm-ups.' : 'Enter the weight you’ll work at.'}</div>`;
    go.disabled = !plan.length; go.style.opacity = plan.length ? 1 : .4;
    go.textContent = plan.length ? `Add ${plan.length} warm-up set${plan.length===1?'':'s'}` : 'Add warm-ups';
  };
  inp.oninput = draw; inp.onfocus = ()=> inp.select(); draw();
  go.onclick = ()=>{
    if(!plan.length) return;
    const doneWarm = ex.sets.filter(s=>s.t==='w' && s.done);
    ex.sets = [...doneWarm, ...plan.map(s=>({...s, t:'w', done:false})), ...ex.sets.filter(s=>s.t!=='w')];
    S.hintTypes = true;
    save(); close(); renderSession();
  };
  sh.querySelector('[data-cancel]').onclick = close;
}

const PLATES = {kg:[25,20,15,10,5,2.5,1.25], lb:[45,35,25,10,5,2.5]};
function plateSplit(target, bar, unit){
  let per = (target - bar)/2;
  if(per < -1e-9) return {under:true, plates:[], made:bar};
  const plates = [];
  for(const p of PLATES[unit]) while(per >= p - 1e-9){ plates.push(p); per -= p; }
  per = Math.max(0, per);
  return {plates, exact: per < 1e-6, made: round1(target - per*2)};
}

function plateSheet(weight, name){
  const u = S.unit, bars = u==='kg' ? [20,15,10,0] : [45,35,25,0];
  let bar = barFor(name);
  const ex = S.active && S.active.exercises.find(x=>x.name===name);
  const quick = ex ? [...new Set(ex.sets.filter(s=>s.t!=='w').map(s=>+s.weight).filter(w=>w>0))].sort((a,b)=>a-b) : [];
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px">Plate calculator</div>
    <div class="sub" style="margin:4px 0 16px">${esc(name||'')}</div>
    <div class="field"><label>Total weight · ${u}</label><input id="pl-w" inputmode="decimal" value="${weight||''}"></div>
    ${quick.length>1 ? `<div class="chips" id="pl-q">${quick.map(w=>`<button class="chip" data-w="${w}">${fmt(w)}</button>`).join('')}</div>` : ''}
    <div class="field"><label>Bar</label><div class="chips wrap" id="pl-b">${bars.map(b=>`<button class="chip ${b===bar?'on':''}" data-b="${b}">${b ? b+' '+u : 'No bar'}</button>`).join('')}</div></div>
    <div id="pl-out" class="plates-out"></div>
    <button class="btn quiet" data-close>Done</button>`);
  const inp = sh.querySelector('#pl-w'), out = sh.querySelector('#pl-out');
  const draw = ()=>{
    const t = +inp.value || 0;
    if(!t){ out.innerHTML = `<div class="sub">Enter a weight.</div>`; return; }
    const r = plateSplit(t, bar, u);
    if(r.under){ out.innerHTML = `<div class="sub">That’s less than the ${bar} ${u} bar on its own.</div>`; return; }
    const max = PLATES[u][0];
    out.innerHTML = `
      <div class="platevis" aria-hidden="true">
        ${bar ? '<i class="sleeve"></i>' : ''}
        ${r.plates.map(p=>`<i class="plate" style="height:${Math.round(34+62*p/max)}px;background:${heat(.25+.75*p/max)}"><b>${fmt(p)}</b></i>`).join('') || '<span class="dim small">Empty</span>'}
      </div>
      <div class="title" style="margin-top:12px">${r.plates.length ? 'Each side: '+r.plates.map(fmt).join(' + ') : 'No plates needed'}</div>
      <div class="sub">${r.exact ? `Loads to ${fmt(t)} ${u}${bar?` on a ${bar} ${u} bar`:''}.`
        : `Closest you can load is ${fmt(r.made)} ${u} — ${fmt(round1(t-r.made))} ${u} short with standard plates.`}</div>`;
  };
  inp.oninput = draw; inp.onfocus = ()=> inp.select();
  sh.querySelectorAll('[data-w]').forEach(b=> b.onclick = ()=>{ inp.value = b.dataset.w; draw(); });
  sh.querySelectorAll('[data-b]').forEach(b=> b.onclick = ()=>{
    bar = +b.dataset.b; sh.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on', x===b));
    if(bar && usesBar(name) && !isEz(name)){ S[u==='kg'?'barKg':'barLb'] = bar; save(); }
    draw();
  });
  sh.querySelector('[data-close]').onclick = close;
  draw();
}

/* ---------- export / import ---------- */
function stamp(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
async function shareJSON(filename, obj, title){
  const text = JSON.stringify(obj, null, 2);
  if(NATIVE){
    // In the app: write the file, then hand it to the iOS share sheet.
    try{
      const r = await nat('Filesystem','writeFile',{path:filename, data:text, directory:'CACHE', encoding:'utf8'});
      await nat('Share','share',{title, files:[r.uri]});
    }catch(err){
      if(!/cancel/i.test(String(err && (err.message || err)))) toast('Couldn’t open the share sheet');
    }
    return;
  }
  const file = new File([text], filename, {type:'application/json'});
  // Share sheet first (AirDrop, Messages, Notes); fall back to a download.
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title}); return; }
    catch(err){ if(err && err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function exportRoutines(){
  shareJSON(`thermal-routines-${stamp()}.json`, {
    kind:'thermal.routines', version:2, exported:new Date().toISOString(),
    unit:S.unit, plans:S.plans
  }, 'Thermal routines');
}
function exportBackup(){
  writeNow();
  shareJSON(`thermal-backup-${stamp()}.json`, {
    kind:'thermal.backup', version:2, exported:new Date().toISOString(),
    unit:S.unit, restDefault:S.restDefault, barKg:S.barKg, barLb:S.barLb,
    plans:S.plans, sessions:S.sessions
  }, 'Thermal backup');
}
// Accepts backups and routine files from every version of Thermal.
function applyImport(data){
  if(data.kind === 'thermal.backup'){
    S.plans = (Array.isArray(data.plans) && data.plans.length) ? data.plans : S.plans;
    S.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    if(data.unit) S.unit = data.unit;
    if(data.restDefault) S.restDefault = data.restDefault;
    if(data.barKg) S.barKg = data.barKg;
    if(data.barLb) S.barLb = data.barLb;
    stopRest(); S.active = null; S = migrate(S); save();
    return 'backup';
  }
  if(data.kind === 'thermal.routines' && Array.isArray(data.plans)){
    // fresh ids so imported days can't collide with existing ones
    data.plans.forEach(p=> (p.days||[]).forEach(d=>{
      d.id = uid(); (d.exercises||[]).forEach(e=> e.id = uid());
      S.plans[0].days.push(d);
    }));
    save();
    return 'routines';
  }
  return null;
}
function importSheet(){
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px;margin-bottom:4px">Import</div>
    <div class="sub" style="margin-bottom:16px">Pick a Thermal export file. Routines are added alongside what you have; a full backup replaces everything.</div>
    <div class="field"><label>File</label><input type="file" id="i-file" accept=".json,application/json,text/plain"></div>
    <button class="btn quiet" data-cancel>Cancel</button>`);
  sh.querySelector('#i-file').onchange = async ev=>{
    const f = ev.target.files[0]; if(!f) return;
    let data;
    try{ data = JSON.parse(await f.text()); }
    catch(e){ close(); confirmSheet('Could not read that file',"It doesn't look like valid JSON.",'OK',()=>{}); return; }

    if(data.kind === 'thermal.backup'){
      close();
      const n = (data.sessions||[]).length, d = (data.plans||[]).reduce((k,p)=>k+(p.days||[]).length,0);
      confirmSheet('Replace everything?',`This backup has ${d} workout day${d===1?'':'s'} and ${n} logged session${n===1?'':'s'}. Your current plans and log are overwritten.`,'Replace',()=>{
        applyImport(data); route.tab='train'; render(); toast('Backup restored');
      });
    } else if(data.kind === 'thermal.routines' && Array.isArray(data.plans)){
      applyImport(data); close(); route.tab='plan'; render(); toast('Routines added');
    } else {
      close();
      confirmSheet('Unrecognised file','That JSON is not a Thermal export.','OK',()=>{});
    }
  };
  sh.querySelector('[data-cancel]').onclick = close;
}

function newDaySheet(){
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px;margin-bottom:16px">New workout day</div>
    <div class="field"><label>Name</label><input id="d-name" placeholder="e.g. Legs"></div>
    <button class="btn" data-save>Create day</button>
    <button class="btn quiet" data-cancel>Cancel</button>`);
  sh.querySelector('[data-save]').onclick = ()=>{
    const n = sh.querySelector('#d-name').value.trim() || 'New day';
    S.plans[0].days.push({id:uid(), name:n, exercises:[]});
    save(); close(); route.tab='plan'; render();
  };
  sh.querySelector('[data-cancel]').onclick = close;
}
function renameDaySheet(dayId){
  const {plan,day} = findDay(dayId);
  const {sh,close} = sheet(`
    <div class="title" style="font-size:19px;margin-bottom:16px">Rename day</div>
    <div class="field"><label>Name</label><input id="d-name" value="${esc(day.name)}"></div>
    <button class="btn" data-save>Save name</button>
    <button class="btn quiet danger" data-del>Delete day</button>`);
  sh.querySelector('[data-save]').onclick = ()=>{
    day.name = sh.querySelector('#d-name').value.trim() || day.name; save(); close(); render();
  };
  sh.querySelector('[data-del]').onclick = ()=>{
    close();
    confirmSheet('Delete '+day.name+'?','The day and its exercises go away. Logged sessions stay.','Delete',()=>{
      plan.days = plan.days.filter(d=>d.id!==dayId); save(); render();
    });
  };
}

/* ---------------- boot ---------------- */
if(!NATIVE){
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
}

(async function(){
  app.innerHTML = `<div class="empty" style="padding-top:120px">Loading…</div>`;
  await load();

  // A rest timer running when the app was closed picks up where it left off.
  if(S.active && S.active.rest){
    if(S.active.rest.endsAt > Date.now() - 60000){ rest = S.active.rest; runRest(); }
    else delete S.active.rest;
  }

  render();
  // The full library adds ~480 exercises; once it's in, anything named after
  // one of them can light up the map, so redraw whatever's showing.
  loadLibrary().then(()=>{ if(!document.querySelector('.sheet')) render(); });

  // keep the in-progress timer honest
  setInterval(()=>{
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    if(S.active && route.tab==='train' && !document.querySelector('.sheet') && !typing) renderSession();
  }, 30000);
})();
