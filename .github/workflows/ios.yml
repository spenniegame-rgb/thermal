# Builds the iPhone app on a GitHub-hosted Mac and publishes Thermal.ipa to the
# "latest" release. The .ipa is unsigned: Sideloadly signs it with your own
# Apple ID when it installs it, so no certificates or secrets live here.
name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ['www/**', 'ios/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest stable Xcode on the runner
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the iOS project
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Thermal.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 60

      - name: Package Thermal.ipa
        run: |
          APP=$(find "$RUNNER_TEMP/Thermal.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "No .app in the archive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry Thermal.ipa Payload)
          ls -lh "$RUNNER_TEMP/ipa/Thermal.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Thermal-ipa
          path: ${{ runner.temp }}/ipa/Thermal.ipa
          retention-days: 30

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/ipa/Thermal.ipa" \
            --target "${{ github.sha }}" \
            --title "Thermal for iPhone · build ${{ github.run_number }}" \
            --notes "Install or update with Sideloadly using your own Apple ID. Installing over the existing app keeps your data. See INSTALL.md." \
            --latest
